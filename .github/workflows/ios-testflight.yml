name: Mobile Release (TestFlight + Play Store)

# Push to main (or run manually) → build the web app, then in parallel:
#   • iOS:     macOS runner → Xcode archive → upload to TestFlight
#   • Android: ubuntu runner → signed AAB → upload to Google Play (internal track)
# Nothing mobile-related runs on your PC.
on:
  push:
    branches: [ main ]
    # Skip runs that only touch docs / android / the workflow itself is fine to keep.
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 40

    env:
      # Bundle id must match capacitor.config.ts / Xcode project.
      BUNDLE_ID: com.proswimlb.app
      TEAM_ID: SJUV7N2435
      SCHEME: App
      XCODE_PROJECT: ios/App/App.xcodeproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # App Store Connect now rejects builds made with anything older than the
      # iOS 26 SDK, so select the newest stable Xcode on the runner (Xcode 26+).
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build web app (capacitor target)
        run: npm run build:cap

      - name: Sync Capacitor iOS
        run: node node_modules/@capacitor/cli/bin/capacitor sync ios

      # Unique, always-increasing build number so TestFlight accepts every upload.
      # Offset keeps it safely above the current build (55).
      - name: Set build number
        run: |
          BUILD_NUMBER=$(( 1000 + GITHUB_RUN_NUMBER ))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Using build number $BUILD_NUMBER"

      # Write the App Store Connect API key (.p8) that Xcode uses to sign in the
      # cloud (creates/downloads the distribution cert + provisioning profile)
      # and to authenticate the TestFlight upload.
      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          KEY_DIR="$HOME/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$ASC_KEY_P8" > "$KEY_DIR/AuthKey.p8"
          echo "ASC_KEY_PATH=$KEY_DIR/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -eo pipefail
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive

      - name: Export & upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -eo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/App/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
        # NOTE: ExportOptions.plist has destination=upload, so this step both
        # exports the .ipa and pushes it to App Store Connect / TestFlight.

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install JS dependencies
        run: npm ci

      - name: Build web app (capacitor target)
        run: npm run build:cap

      - name: Sync Capacitor Android
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      # Decode the upload keystore and write a keystore.properties that points to
      # it, so android/app/build.gradle's release signingConfig picks it up.
      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          cat > android/keystore.properties <<EOF
          storeFile=upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # Unique, always-increasing versionCode (offset keeps it above current 54).
      - name: Build signed AAB
        run: |
          set -eo pipefail
          VERSION_CODE=$(( 1000 + GITHUB_RUN_NUMBER ))
          echo "Using versionCode $VERSION_CODE"
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease -PversionCodeOverride=$VERSION_CODE --no-daemon

      # Save the signed .aab so it can be downloaded from the run and uploaded to
      # Play by hand (the first upload to a draft app can't go through the API).
      - name: Upload AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload to Google Play (internal testing track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.proswimlb.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
